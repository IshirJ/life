name = "life-sync"
main = "src/index.js"
compatibility_date = "2026-06-01"
workers_dev = true

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "LIFE"
id = "__KV_ID__"

[[durable_objects.bindings]]
name = "HUB"
class_name = "SyncHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncHub"]
