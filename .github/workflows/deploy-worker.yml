name: Deploy life-sync worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=life-sync not deployed::Add repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (Settings > Secrets and variables > Actions), then re-run this workflow. See worker/README.md."
            {
              echo "### life-sync was not deployed"
              echo "Repository secrets \`CLOUDFLARE_API_TOKEN\` and/or \`CLOUDFLARE_ACCOUNT_ID\` are missing."
              echo "Add them under **Settings → Secrets and variables → Actions**, then run this workflow again (Actions → Deploy life-sync worker → Run workflow)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci

      - name: Test
        if: steps.secrets.outputs.ready == 'true'
        run: npm test

      - name: Ensure KV namespace
        if: steps.secrets.outputs.ready == 'true'
        run: node scripts/ensure-kv.mjs

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        id: deploy
        run: |
          set -o pipefail
          if ! npx wrangler deploy 2>&1 | tee deploy.log; then
            echo "::error::$(tail -c 1500 deploy.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
            exit 1
          fi
          URL="$(grep -oE 'https://[a-zA-Z0-9._-]+\.workers\.dev' deploy.log | head -n1 || true)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          [ -n "$URL" ] && echo "::notice::Worker URL $URL"
          {
            echo "### life-sync deployed"
            if [ -n "$URL" ]; then
              echo "Worker URL: **$URL**"
              echo ""
              echo "Paste this URL into Life (Settings → Connections) and tap Connect."
            else
              echo "Deployed, but no workers.dev URL was printed. Make sure a workers.dev subdomain is set up (Cloudflare dashboard → Workers & Pages) and that workers.dev is enabled for life-sync."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
