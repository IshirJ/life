<style>
/* Layout: one-column phone app. Every tab opens with a glass "hero" card (number + art), then sectioned cards.
   Floating glass tab bar with labels + round add button. Openers come from their button (side panel, drop-down, bottom sheet, zoom).
   Type: Newsreader serif headlines (italic accents), Geist UI, Space Mono caps labels, Doto dot-matrix for hero numbers. */
:root{
  --bg:#F4F0E7; --surface:#FFFCF6; --surface2:#E9E3D6; --ink:#24211C; --ink2:#4A463E; --muted:#7A7366; --line:#DFD8C9;
  --accent:#D9552E; --accent-ink:#FFFFFF; --sage:#4E6A5A; --sage-ink:#F3F0E6; --sage-soft:#6A8977;
  --bar:#24211C; --bar-ink:#B7AF9F; --late:#B8341F; --soon:#A8650F; --good:#2F7A4C;
  --hi:rgb(255 255 255 / .75); --shadow:0 10px 30px rgb(80 60 30 / .10); --card-shadow:0 1px 0 rgb(255 255 255 / .6) inset,0 6px 18px rgb(80 60 30 / .06);
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --ui:'Geist',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:'Space Mono',ui-monospace,Menlo,monospace;
  --dot:'Doto','Space Mono',ui-monospace,monospace;
  --r-xl:28px; --r-l:22px; --r-m:18px; --r-s:12px;
  --glass-blur:26; --glass-tint:69; --gap:0px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131311; --surface:#1D1C19; --surface2:#2B2A26; --ink:#F2EDE3; --ink2:#D5CFC2; --muted:#A39C8E; --line:#33312C;
  --accent:#F06D44; --accent-ink:#1A0D07; --sage:#3E5749; --sage-ink:#EFF1E9; --sage-soft:#557262;
  --bar:#2A2925; --bar-ink:#A39C8E; --late:#FF8A75; --soon:#F0B35C; --good:#86CFA0;
  --hi:rgb(255 255 255 / .07); --shadow:0 10px 30px rgb(0 0 0 / .35); --card-shadow:0 1px 0 rgb(255 255 255 / .06) inset,0 8px 22px rgb(0 0 0 / .25);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#131311; --surface:#1D1C19; --surface2:#2B2A26; --ink:#F2EDE3; --ink2:#D5CFC2; --muted:#A39C8E; --line:#33312C;
  --accent:#F06D44; --accent-ink:#1A0D07; --sage:#3E5749; --sage-ink:#EFF1E9; --sage-soft:#557262;
  --bar:#2A2925; --bar-ink:#A39C8E; --late:#FF8A75; --soon:#F0B35C; --good:#86CFA0;
  --hi:rgb(255 255 255 / .07); --shadow:0 10px 30px rgb(0 0 0 / .35); --card-shadow:0 1px 0 rgb(255 255 255 / .06) inset,0 8px 22px rgb(0 0 0 / .25);
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:500 15px/1.45 var(--ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:var(--icon-w,2.1);stroke-linecap:round;stroke-linejoin:round;flex:none}
/* iOS 26 home-screen bug (WebKit 301108): with a translucent status bar the web view is one status-bar
   height short whenever the page is not taller than the screen. A page at least screen-tall gets the full view. */
@media (display-mode: standalone){html{min-height:min(100lvh,calc(100% + env(safe-area-inset-top)))}body{min-height:inherit}}
html{background:var(--bg)}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,.notes,[contenteditable]{-webkit-user-select:text;user-select:text}
#bgcurve{position:fixed;inset:-4% -10%;width:120%;height:108%;z-index:0;pointer-events:none;will-change:transform}
#bgcurve canvas{position:absolute;inset:0;display:block}
:root[data-theme="light"] #bgcurve{opacity:.7}
#scroller{z-index:1;position:fixed;inset:0 0 calc(-1 * var(--gap)) 0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;scrollbar-width:none}
#scroller::-webkit-scrollbar{display:none}
#scroller.locked{overflow:hidden}
body.panel .dock{transform:translateY(130%);opacity:0;pointer-events:none}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.cap{font:400 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:5;display:flex;align-items:center;gap:12px;padding:12px 8px;margin:4px -8px 6px;border-radius:var(--r-l);
  will-change:transform;transition:transform .42s cubic-bezier(.22,1,.36,1),opacity .3s ease,background-color .3s ease,box-shadow .3s ease}
.top.float{background:color-mix(in srgb,var(--surface) 78%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);
  box-shadow:inset 0 1px 0 var(--hi),inset 0 0 0 1px rgb(255 255 255 / .06),0 10px 26px rgb(0 0 0 / .16)}
.top.away{transform:translateY(calc(-100% - 24px));opacity:0;pointer-events:none}

.av{width:46px;height:46px;border-radius:50%;color:var(--sage-ink);display:grid;place-items:center;font:700 15px var(--ui);flex:none;
  background:radial-gradient(circle at 32% 26%,rgb(255 255 255 / .55),rgb(255 255 255 / 0) 40%),linear-gradient(150deg,var(--sage-soft),var(--sage));box-shadow:inset 0 1px 0 rgb(255 255 255 / .4),0 4px 12px rgb(0 0 0 / .15)}
.av{position:relative;overflow:visible;margin:0 10px 0 6px}
.avr{position:absolute;left:50%;top:50%;width:80px;height:80px;margin:-40px 0 0 -40px;pointer-events:none;overflow:visible;opacity:0;transition:opacity .35s ease}
.avr circle{fill:none;stroke-linecap:round}
.avr g{transform-origin:40px 40px;transform:rotate(var(--a0,0deg));filter:drop-shadow(0 0 2px rgb(240 109 68 / .45))}
.rings-on .avr{opacity:1}
.rings-on .avr g{animation:avspin var(--dur,20s) linear infinite var(--dir,normal)}
@keyframes avspin{from{transform:rotate(var(--a0,0deg))}to{transform:rotate(calc(var(--a0,0deg) + 360deg))}}
html[data-motion="off"] .avr g{animation:none}
.top{overflow:visible}
@keyframes glitch{0%{filter:none;transform:none;opacity:1}
  8%{filter:brightness(1.9) drop-shadow(-2px 0 0 rgb(80 220 255 / .75)) drop-shadow(2px 0 0 rgb(255 70 160 / .7));transform:translateX(1.5px)}
  14%{filter:brightness(.6);opacity:.55;transform:translateX(-1.5px) skewX(-4deg)}
  22%{filter:brightness(2.3) drop-shadow(0 0 10px var(--accent));opacity:1;transform:none}
  32%{filter:brightness(1) drop-shadow(1px 0 0 rgb(80 220 255 / .6)) drop-shadow(-1px 0 0 rgb(255 70 160 / .6));transform:translateX(-.8px)}
  44%{filter:brightness(1.8) drop-shadow(0 0 14px var(--accent));opacity:.8;transform:none}
  58%{filter:brightness(1.05);opacity:1}
  70%{filter:brightness(1.5) drop-shadow(0 0 8px var(--accent))}
  100%{filter:none;transform:none;opacity:1}}
.glitch{animation:glitch .85s linear both}
.hello{flex:1;min-width:0}
.hello h1{font:500 clamp(22px,6.6vw,27px)/1.12 var(--serif);margin:3px 0 0;letter-spacing:-.01em;overflow-wrap:anywhere}
.hello h1 em{font-style:italic;color:var(--accent)}
.ib{width:46px;height:46px;border-radius:var(--r-m);display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);box-shadow:var(--card-shadow);position:relative;flex:none;transition:transform .2s}
.ib:active{transform:scale(.94)}
.badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;border-radius:var(--r-s);background:var(--accent);color:#fff;font:800 11px/19px var(--ui);text-align:center;padding:0 5px;box-shadow:0 0 0 2px var(--bg)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 10px 10px 14px;font-size:13px;margin-bottom:14px;color:var(--ink2)}
.banner button{font-weight:800;color:var(--ink);background:var(--surface2);border-radius:999px;padding:8px 14px}

/* hero card (every tab) */
.hero{background:var(--sage);color:var(--sage-ink);border-radius:var(--r-xl);padding:22px 20px 20px;position:relative;overflow:hidden;box-shadow:var(--shadow),inset 0 1px 0 rgb(255 255 255 / .18)}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgb(255 255 255 / .10),rgb(255 255 255 / 0) 45%);pointer-events:none}
.hero-art{position:absolute;right:-30px;top:-22px;width:200px;height:156px;pointer-events:none;opacity:.42}
.hero>*:not(.hero-art){position:relative}
.hero .cap{color:rgb(243 240 230 / .75)}
.hero .big{font:900 60px/1 var(--dot);letter-spacing:.02em;margin:10px 0 4px}
.hero .lead{font:italic 500 19px/1.3 var(--serif)}
.hero .lead b{font-style:normal;font-weight:500}
.segs{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin:16px 0 16px}
.segs i{height:9px;border-radius:5px;background:rgb(243 240 230 / .2)}
.segs i.on{background:var(--sage-ink)}
.segs i.over{background:var(--accent)}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.macros div{min-width:0}
.macros b{display:block;font:700 18px var(--mono);margin-top:3px}
.macros small{font:400 11px var(--mono);opacity:.75}
.hero-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:999px;font-weight:800;font-size:15px;width:100%;white-space:nowrap;transition:transform .32s cubic-bezier(.34,1.56,.64,1),background .2s}
.pill:active{transform:scale(.95);transition-duration:.08s}
.pill.light{background:var(--sage-ink);color:#24211C;box-shadow:0 4px 0 rgb(0 0 0 / .22),inset 0 1px 0 #fff}
.pill.glassy{background:rgb(255 255 255 / .14);color:var(--sage-ink);box-shadow:0 4px 0 rgb(0 0 0 / .16),inset 0 1px 0 rgb(255 255 255 / .35),inset 0 0 0 1px rgb(255 255 255 / .22);}
.hero-stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}
.hero-stats div{min-width:0}
.hero-stats b{display:block;font:700 18px var(--mono);margin-top:2px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:16px -16px 0;padding:2px 16px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px 0 7px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--card-shadow);font-weight:700;font-size:14px;white-space:nowrap;flex:none;transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .2s,color .2s}
.chip:active{transform:scale(.95)}
.chips:first-child{margin-top:0;margin-bottom:14px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* sections & cards */
.sec{margin-top:28px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;min-height:36px}
h2{font:500 22px/1.2 var(--serif);margin:0;text-wrap:balance}
h2 em{font-style:italic}
.link{font-size:13px;font-weight:800;color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:999px;height:36px;padding:0 14px;display:inline-flex;align-items:center;gap:6px}
.link svg.i{width:15px;height:15px}
.card-s{background:var(--surface);border:1px solid var(--line);box-shadow:var(--card-shadow)}

/* ring tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{border-radius:var(--r-l);padding:14px 12px;display:flex;flex-direction:column;gap:12px;min-width:0;text-align:left}
.ring{width:48px;height:48px;position:relative}
.ring svg{width:48px;height:48px;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;color:var(--accent)}
.ring span svg.i{width:18px;height:18px;transform:none}
.tile b{font:700 19px var(--mono);display:block}
.tile b small{font:400 11px var(--mono);color:var(--muted);margin-left:2px}
.delta{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:4px;font:700 12px var(--mono);padding:5px 10px;border-radius:999px;background:var(--surface2)}
.delta.down{color:var(--good)}.delta.up{color:var(--late)}

/* weight card */
.wcard{border-radius:var(--r-l);padding:18px}
.wtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.wnum{font:900 50px/1 var(--dot);margin-top:8px}
.wnum small{font:400 13px var(--mono);color:var(--muted);margin-left:4px}
.wcard svg.chart{width:100%;height:auto;display:block;margin-top:12px}
.goal{font:400 12px var(--mono);color:var(--muted);margin-top:6px}
.goal b{color:var(--ink);font-weight:700}

/* lists */
.list{list-style:none;margin:0;padding:4px 0;border-radius:var(--r-l)}
.row{display:flex;align-items:center;gap:12px;padding:8px 14px;min-height:64px}
.row+.row{border-top:1px solid var(--line)}
.chk{width:44px;height:44px;display:grid;place-items:center;flex:none;margin:0 -2px}
.chk i{width:26px;height:26px;border-radius:50%;border:2px solid color-mix(in srgb,var(--ink) 35%,transparent);display:grid;place-items:center;transition:background .2s,border-color .2s}
.chk svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.chk.on i{background:var(--accent);border-color:var(--accent)}.chk.on svg{opacity:1}
.rowbtn{flex:1;min-width:0;text-align:left;padding-block:8px;display:flex;flex-direction:column;gap:2px}
.rt{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.done .rt{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--ink2);opacity:.75}
.meta{font:700 12px var(--mono);color:var(--ink2);flex:none;padding:6px 10px;border-radius:999px;background:var(--surface2);font-variant-numeric:tabular-nums;align-self:center}
.meta.late{background:color-mix(in srgb,var(--late) 16%,transparent);color:var(--late)}
.meta.soon{background:color-mix(in srgb,var(--soon) 18%,transparent);color:var(--soon)}
.meta.plain{background:none;padding:0;color:var(--muted);font-weight:700}
.empty{margin:0;padding:16px 18px;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:var(--r-l);display:flex;align-items:center;gap:14px;min-height:84px}
.empty svg.art{width:56px;height:56px;flex:none}

/* icon tiles */
.ico{width:42px;height:42px;border-radius:var(--r-s);position:relative;color:#fff;display:grid;place-items:center;flex:none;background:linear-gradient(160deg,var(--c1),var(--c2));
  box-shadow:inset 0 1px 0 rgb(255 255 255 / .45),inset 0 -2px 4px rgb(0 0 0 / .12),0 4px 10px color-mix(in srgb,var(--c2) 30%,transparent)}
.ico::before{content:"";position:absolute;inset:1px 1px 52% 1px;border-radius:11px 11px 50% 50% / 11px 11px 22% 22%;background:linear-gradient(rgb(255 255 255 / .34),rgb(255 255 255 / 0));pointer-events:none}
.ico svg.i{width:21px;height:21px;stroke-width:2.4;position:relative;filter:drop-shadow(0 1px 1px rgb(0 0 0 / .18))}
.k-food{--c1:#FF9F6B;--c2:#D9552E}.k-weight{--c1:#62C7BE;--c2:#1F7C80}.k-workout{--c1:#93C97A;--c2:#4A8A3E}
.k-activity{--c1:#6FC3F0;--c2:#2D6FB8}
.k-injury{--c1:#F28A92;--c2:#B83A4E}.k-task{--c1:#E9A86A;--c2:#B4622A}.k-reminder{--c1:#F5CB6B;--c2:#C98A14}
.k-class{--c1:#9B95E8;--c2:#5B4FC2}.k-meeting{--c1:#7CB7DE;--c2:#3A72A8}.k-project{--c1:#E3B477;--c2:#9C6A2A}
.k-idea{--c1:#F2D36E;--c2:#C2950F}.k-note{--c1:#D3C2A3;--c2:#8E7656}.k-scrap{--c1:#B9B6AE;--c2:#6C6960}.k-folder{--c1:#C9A7E8;--c2:#7D55B5}
:root[data-icons="mono"] .ico{background:var(--surface2);color:var(--ink2);box-shadow:none}
:root[data-icons="mono"] .ico::before{display:none}
.chip .ico{width:30px;height:30px;border-radius:var(--r-s)}
.chip .ico svg.i{width:16px;height:16px}
.chip .ico::before{border-radius:8px 8px 50% 50% / 8px 8px 22% 22%}

/* timeline */
.tl{display:flex;flex-direction:column;gap:10px}
.tli{display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px;align-items:center}
.tli .tm{font:700 13px/1.2 var(--mono);color:var(--ink2);text-align:right}
.tli .tm small{display:block;font-weight:400;font-size:10px;color:var(--muted)}
.tcard{display:flex;align-items:center;gap:12px;border-radius:var(--r-m);padding:10px 12px;text-align:left;min-width:0}
.tcard .rowbtn{padding:0}

/* week strip */
.wk{border-radius:var(--r-l);padding:12px 10px 12px}
.cal-ctl{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.cal-ctl .seg2{flex:1}
.cal-f{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.cal-f button{height:34px;padding:0 12px 0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:7px;color:var(--muted);transition:color .2s,border-color .2s}
.cal-f button i{width:10px;height:10px;border-radius:3px;background:linear-gradient(160deg,var(--c1),var(--c2));opacity:.35;transition:opacity .2s}
.cal-f button i.due{background:var(--accent);border-radius:50%}
.cal-f button[aria-pressed="true"]{color:var(--ink);border-color:color-mix(in srgb,var(--ink) 30%,transparent)}
.cal-f button[aria-pressed="true"] i{opacity:1}
.blk.wide{font-size:13px;padding:6px 10px;border-radius:var(--r-s)}
.blk small{display:block;font-weight:600;font-size:11px;opacity:.88;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mh{font:400 10px var(--mono);text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:4px}
.mc{aspect-ratio:1/1.08;border-radius:var(--r-s);display:flex;flex-direction:column;align-items:center;padding-top:7px;gap:5px;transition:background .2s,color .2s}
.mc b{font:800 15px var(--ui)}
.mc.out{opacity:.32}
.mc.today b{color:var(--accent)}
.mc.on{background:var(--ink);color:var(--bg)}.mc.on.today b{color:var(--bg)}
.mc .dots{display:flex;gap:3px;height:6px}
.mc .dots i{width:6px;height:6px;border-radius:50%;background:linear-gradient(160deg,var(--c1),var(--c2))}
.mc .dots i.due{background:var(--accent)}
.wk-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.wk-top b{font:500 18px var(--serif)}
.wk-nav{width:38px;height:38px;border-radius:50%;background:var(--surface2);display:grid;place-items:center}
.wk-nav .chev{width:18px;height:18px}.wk-nav .l{transform:rotate(90deg)}.wk-nav .r{transform:rotate(-90deg)}
.wk-head{display:grid;grid-template-columns:28px repeat(7,minmax(0,1fr));gap:3px;margin-bottom:6px}
.wk-head::before{content:""}
.wd{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px;border-radius:var(--r-s);transition:background .25s,color .25s}
.wd span{font:400 10px var(--mono);text-transform:uppercase;color:var(--muted)}
.wd b{font:800 16px var(--ui)}
.wd i{font:700 9px/14px var(--mono);font-style:normal;height:14px;min-width:14px;border-radius:var(--r-xs);padding:0 3px}
.wd i.has{background:var(--accent);color:#fff}
.wd.today b{color:var(--accent)}
.wd.on{background:var(--ink);color:var(--bg)}.wd.on span{color:var(--bar-ink)}.wd.on.today b{color:var(--bg)}
.wk-body{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr);gap:3px}
.wk-hours{position:relative}
.wk-hours span{position:absolute;right:2px;transform:translateY(-6px);font:400 9px var(--mono);color:var(--muted)}
.wk-cols{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;
  background:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--ph))}
.wcol{position:relative;border-radius:var(--r-xs);transition:background .25s}
.wcol.on{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.blk{position:absolute;left:0;right:0;border-radius:var(--r-xs);padding:3px 4px;color:#fff;font:700 10px/1.15 var(--ui);text-align:left;overflow:hidden;overflow-wrap:break-word;word-break:normal;hyphens:none;-webkit-hyphens:none;
  background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:inset 0 1px 0 rgb(255 255 255 / .35),0 2px 6px rgb(0 0 0 / .18)}
.blk:not(.wide){font-size:9.5px;line-height:1.12;padding:3px 3px;letter-spacing:-.01em}
.blk .bt{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis}
.nowline{position:absolute;left:-2px;right:0;height:2px;background:var(--late);border-radius:2px;z-index:2}
.nowline::before{content:"";position:absolute;left:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--late)}
.wk-key{display:flex;gap:14px;justify-content:flex-end;margin-top:10px;font:400 10px var(--mono);text-transform:uppercase;color:var(--muted)}
.wk-key span{display:inline-flex;align-items:center;gap:5px}
.wk-key i{width:10px;height:10px;border-radius:3px;background:linear-gradient(160deg,var(--c1),var(--c2))}
.wk-key i.due{background:var(--accent);border-radius:50%}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:16px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;border-radius:var(--r-m);transition:background .25s,color .25s,transform .25s}
.day:active{transform:scale(.94)}
.day b{font:800 19px var(--ui)}
.day .cnt{font:700 10px var(--mono);height:16px;min-width:16px;padding:0 4px;border-radius:var(--r-xs);display:grid;place-items:center;background:var(--surface2);color:var(--ink2)}
.day .cnt.zero{visibility:hidden}
.day.on{background:var(--accent);border-color:var(--accent);color:#fff}
.day.on .cap{color:rgb(255 255 255 / .8)}
.day.on .cnt{background:rgb(255 255 255 / .25);color:#fff}

/* ideas grid & folders */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{border-radius:var(--r-l);padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-width:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-y;transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .2s}
.card h4{margin:0;font:500 19px/1.2 var(--serif)}
.card p{margin:0;font-size:13px;line-height:1.45;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.card .cardtop{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.tag{font:400 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--surface2);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.card.lifting{opacity:.25;transform:scale(.96)}
.folders{display:flex;gap:10px;overflow-x:auto;margin:16px -16px 0;padding:4px 16px 8px;scrollbar-width:none}
.folders::-webkit-scrollbar{display:none}
.folder{flex:none;width:118px;border-radius:var(--r-l);padding:12px;text-align:left;display:flex;flex-direction:column;gap:10px;transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .2s,background .2s;position:relative}
.folder b{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder .cap{margin-top:-6px}
.folder.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.folder.on .cap{color:var(--bar-ink)}
.folder.target{transform:scale(1.08);box-shadow:0 0 0 3px var(--accent),var(--card-shadow)}
.folder.bump{animation:bump .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.14)}100%{transform:scale(1)}}
.folder.new{border:1.5px dashed var(--line);background:transparent;box-shadow:none;justify-content:space-between;color:var(--ink2)}
.ghost{position:fixed;z-index:40;pointer-events:none;border-radius:var(--r-l);box-shadow:0 24px 50px rgb(0 0 0 / .35);transform-origin:center;margin:0}
.hint{font-size:13px;color:var(--muted);margin:4px 0 12px}

/* pain */
.pain{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;width:66px;flex:none}
.pain i{height:8px;border-radius:2px;background:var(--surface2)}
.pain i.on{background:var(--accent)}
.painbig{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:2px}
.painbig i{height:14px;border-radius:4px;background:color-mix(in srgb,var(--ink) 12%,transparent)}
.painbig i.on{background:linear-gradient(90deg,#F2B35C,var(--accent))}

/* stats & heatmap */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{border-radius:var(--r-l);padding:14px 16px;min-width:0}
.stat .v{font:700 28px/1.1 var(--mono);margin-top:8px}
.stat .v.good{color:var(--good)}.stat .v.bad{color:var(--late)}
.stat .cap{display:flex;align-items:center;gap:6px}
.stat .cap svg.i{width:14px;height:14px}
.heat{border-radius:var(--r-l);padding:14px;position:relative}
.heat-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:auto repeat(7,auto);gap:4px}
.hm .mo{font:400 9px var(--mono);color:var(--muted);text-transform:uppercase;height:12px;white-space:nowrap;overflow:visible}
.hm button{aspect-ratio:1;border-radius:4px;background:color-mix(in srgb,var(--ink) 9%,var(--surface));padding:0;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.hm button.fut{background:transparent;pointer-events:none}
.l1{background:color-mix(in srgb,var(--accent) 32%,var(--surface2))!important}
.l2{background:color-mix(in srgb,var(--accent) 56%,var(--surface2))!important}
.l3{background:color-mix(in srgb,var(--accent) 80%,var(--surface2))!important}
.l4{background:var(--accent)!important}
.hm button.now{box-shadow:0 0 0 1.5px var(--ink)}
.hm button.sel{transform:scale(1.35);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink);position:relative;z-index:2}
.legend{display:flex;justify-content:flex-end;align-items:center;gap:4px;margin-top:12px}
.legend i{width:13px;height:13px;border-radius:3px;background:color-mix(in srgb,var(--ink) 9%,var(--surface))}
.legend .cap{margin:0 4px}
.tip{position:absolute;z-index:3;padding:8px 12px;border-radius:var(--r-m);font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none;left:0;top:0;
  background:color-mix(in srgb,var(--ink) 82%,transparent);color:var(--bg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:inset 0 1px 0 rgb(255 255 255 / .25),0 8px 24px rgb(0 0 0 / .25);transform-origin:50% 100%;transition:opacity .18s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.tip.hide{opacity:0;transform:translateY(4px) scale(.9)}
.tip small{display:block;font:400 10px var(--mono);opacity:.75;text-transform:uppercase;letter-spacing:.06em}

/* segmented */
.seg2{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--surface2)}
.seg2 button{flex:1;height:36px;border-radius:999px;font-weight:800;font-size:13px;color:var(--muted);transition:background .2s,color .2s}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* ===== wide layouts: phone turned sideways (land) and iPad / laptop (tab). Tabs become a side rail, content flows into columns ===== */
html[data-lay="land"]{--railw:78px}
html[data-lay="tab"]{--railw:100px}
html:not([data-lay="port"]) .dock{left:0;top:0;bottom:0;right:auto;width:calc(var(--railw) + env(safe-area-inset-left,0px));padding:max(12px,env(safe-area-inset-top,0px)) 10px max(12px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));background:none}
html:not([data-lay="port"]) .dock::before{display:none}
html:not([data-lay="port"]) body.panel .dock{transform:translateX(-130%)}
html:not([data-lay="port"]) .tabs{touch-action:none}
html:not([data-lay="port"]) .dock-in{height:100%;flex-direction:column;justify-content:center;max-width:none;gap:14px}
html:not([data-lay="port"]) .tabs{flex:none;width:100%;grid-template-columns:1fr;padding:6px;border-radius:var(--r-xl)}
html:not([data-lay="port"]) .tabs .ind{top:0;left:6px;right:6px;height:54px;width:auto!important}
html[data-lay="land"] .tabs button{height:50px}html[data-lay="land"] .tabs .ind{height:50px}
html[data-lay="tab"] .tabs button{height:64px;font-size:11px}html[data-lay="tab"] .tabs .ind{height:64px}html[data-lay="tab"] .tabs button svg.i{width:24px;height:24px}
html:not([data-lay="port"]) .fab{width:58px;height:58px}
html:not([data-lay="port"]) .app{max-width:1500px;padding-left:calc(var(--railw) + env(safe-area-inset-left,0px) + 22px);padding-right:max(22px,env(safe-area-inset-right,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
html:not([data-lay="port"]) .pane{columns:2 330px;column-gap:24px}
html[data-lay="tab"] .pane{columns:3 300px;column-gap:26px}
html:not([data-lay="port"]) .pane>*{break-inside:avoid}
html:not([data-lay="port"]) .pane>.qbar{column-span:all}
html:not([data-lay="port"]) .pane>.chips,html:not([data-lay="port"]) .pane>.hero,html:not([data-lay="port"]) .pane>.banner,html:not([data-lay="port"]) .pane>.sec:has(.wk),html:not([data-lay="port"]) .pane>.sec:has(.abars),html:not([data-lay="port"]) .pane>.lay-wide{column-span:all}
html:not([data-lay="port"]) .pane>.sec:first-of-type{margin-top:22px}
html:not([data-lay="port"]) .pane>.hero{max-width:none}
html:not([data-lay="port"]) #fcPill{left:auto;right:max(20px,env(safe-area-inset-right,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));transform:none}
html:not([data-lay="port"]) .m-bottom{max-width:620px}
html[data-lay="land"] .top{margin-bottom:2px}
#view.relay{animation:relay .62s cubic-bezier(.22,1,.36,1) both}
@keyframes relay{from{opacity:0;transform:scale(.955) translateY(10px);filter:blur(10px) brightness(1.4)}60%{filter:blur(0) brightness(1.15)}to{opacity:1;transform:none;filter:none}}
.dock.relay-side{animation:relaySide .6s cubic-bezier(.22,1.2,.36,1) both}
.dock.relay-bottom{animation:relayBottom .6s cubic-bezier(.22,1.2,.36,1) both}
@keyframes relaySide{from{transform:translateX(-110%);opacity:0}to{transform:none;opacity:1}}
@keyframes relayBottom{from{transform:translateY(110%);opacity:0}to{transform:none;opacity:1}}
/* ===== quick capture, grades, money, insights, time-blocking, cards, trips, people ===== */
.k-expense{--c1:#6FD3A0;--c2:#2F8A5A}.k-trip{--c1:#7FD3FF;--c2:#2D7FB8}.k-grades{--c1:#B9C6FF;--c2:#5568D8}.k-cards{--c1:#FFD27A;--c2:#C98A14}.k-block{--c1:#5ED3D0;--c2:#1F8A8A}
.qbar{position:relative;display:flex;align-items:center;gap:8px;margin:14px 0 4px;padding:6px 6px 6px 14px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line);box-shadow:var(--card-shadow);flex-wrap:wrap}
.qbar .qbi{color:var(--accent);display:grid;place-items:center}.qbar .qbi svg.i{width:18px;height:18px}

.grab{position:relative;cursor:grab}.grab::before{content:"";position:absolute;inset:-16px -70px}
.m-bottom.tall{top:calc(10px + env(safe-area-inset-top,0px));max-height:none;display:flex;flex-direction:column;overflow:hidden;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.m-bottom.tall #sheetBody{flex:1;min-height:0;display:flex;flex-direction:column}
#sheetBody{min-width:0}
#flHead,#flBot,.m-bottom.tall .sh-h{flex:none}
#sheetBody h3{min-width:0;overflow-wrap:anywhere}

.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;min-height:40px}
.sh-h .lhs{display:flex;align-items:center;gap:10px;min-width:0}
h3{font:500 26px/1.15 var(--serif);margin:0}
h3 em{font-style:italic;color:var(--accent)}
.x{width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--ink) 12%,transparent);display:grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 var(--hi)}
.x svg.i{width:18px;height:18px}
.fld{display:flex;flex-direction:column;gap:8px;margin:0 0 16px;border:0;padding:0;min-width:0}
.fld>span,.fld legend{font:400 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0}
input,textarea{font:600 16px var(--ui);color:var(--ink);background:color-mix(in srgb,var(--surface) 80%,transparent);border:1px solid color-mix(in srgb,var(--ink) 14%,transparent);border-radius:var(--r-m);padding:14px 16px;width:100%;min-width:0;box-shadow:inset 0 1px 2px rgb(0 0 0 / .06);transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
input::placeholder,textarea::placeholder{color:var(--muted);font-weight:500}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-height:52px;display:flex;align-items:center}
input::-webkit-calendar-picker-indicator{opacity:.6;cursor:pointer;margin:0}
textarea{resize:vertical;min-height:96px;line-height:1.45}
input[type=range]{-webkit-appearance:none;appearance:none;height:30px;padding:0;background:none;border:0;box-shadow:none}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:var(--r-xs);background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--surface2) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;margin-top:-9px;background:#fff;box-shadow:0 2px 8px rgb(0 0 0 / .3),inset 0 0 0 1px rgb(0 0 0 / .06)}
input[type=range]::-moz-range-track{height:8px;border-radius:var(--r-xs);background:var(--surface2)}
input[type=range]::-moz-range-progress{height:8px;border-radius:var(--r-xs);background:var(--accent)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px rgb(0 0 0 / .3)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.daychip{position:relative}
.daychip input{position:absolute;opacity:0;width:1px;height:1px}
.daychip span{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid color-mix(in srgb,var(--ink) 14%,transparent);background:color-mix(in srgb,var(--surface) 80%,transparent);font-weight:800;font-size:13px;color:var(--muted);transition:background .2s,color .2s,transform .25s cubic-bezier(.34,1.56,.64,1)}
.daychip input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff;transform:scale(1.06)}
.daychip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.sh-actions{display:flex;gap:10px;margin-top:10px}
.primary{flex:1;height:54px;background:var(--ink);color:var(--bg);font-weight:800;font-size:16px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:inset 0 1px 0 rgb(255 255 255 / .2),0 6px 16px rgb(0 0 0 / .18);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.primary svg.i{width:18px;height:18px}
.primary:active,.danger:active,.secondary:active{transform:scale(.96);transition-duration:.08s}
.secondary{flex:1;height:54px;background:color-mix(in srgb,var(--ink) 10%,transparent);font-weight:800;font-size:16px;border-radius:999px;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.danger{height:54px;color:var(--late);font-weight:800;border:1px solid color-mix(in srgb,var(--late) 40%,transparent);border-radius:999px;padding:0 20px;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.typegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.typegrid button{border-radius:var(--r-l);padding:16px 8px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;font-weight:800;font-size:14px;line-height:1.2;min-height:112px;
  background:color-mix(in srgb,var(--surface) 60%,transparent);border:1px solid rgb(255 255 255 / .16);box-shadow:inset 0 1px 0 var(--hi),0 6px 18px rgb(0 0 0 / .08)}
.typegrid .ico{width:46px;height:46px;border-radius:var(--r-m)}
.typegrid .lbl{grid-column:1/-1;margin:16px 0 0}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:11px 18px;border-radius:var(--r-l);width:max-content;max-width:calc(100vw - 40px);text-align:center;line-height:1.35;white-space:normal;overflow-wrap:anywhere;font-weight:800;font-size:14px;z-index:30;pointer-events:none;color:var(--bg);
  background:color-mix(in srgb,var(--ink) 80%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.8);backdrop-filter:blur(18px) saturate(1.8);box-shadow:inset 0 1px 0 rgb(255 255 255 / .25),0 10px 30px rgb(0 0 0 / .25);animation:toastIn .45s cubic-bezier(.22,1,.36,1)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px) scale(.9)}}

/* custom select (glass menu) */
.sel-btn{width:100%;min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px 0 16px;border-radius:var(--r-m);font-weight:700;font-size:16px;text-align:left;
  background:color-mix(in srgb,var(--surface) 80%,transparent);border:1px solid color-mix(in srgb,var(--ink) 14%,transparent);box-shadow:inset 0 1px 2px rgb(0 0 0 / .06);transition:border-color .2s,box-shadow .2s}
.sel-btn[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.sel-btn .chev{width:18px;height:18px;transition:transform .35s cubic-bezier(.22,1,.36,1);color:var(--muted)}
.sel-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.menu{position:fixed;z-index:50;min-width:180px;padding:6px;border-radius:var(--r-l);
  background:color-mix(in srgb,var(--surface) 72%,transparent);-webkit-backdrop-filter:blur(28px) saturate(2);backdrop-filter:blur(28px) saturate(2);
  box-shadow:inset 0 1px 0 var(--hi),inset 0 0 0 1px rgb(255 255 255 / .12),0 24px 60px rgb(0 0 0 / .32);
  transform-origin:50% 0;transition:opacity .2s ease,transform .35s cubic-bezier(.22,1,.36,1)}
.menu.up{transform-origin:50% 100%}
.menu.hide{opacity:0;transform:scale(.92) translateY(-6px)}
.menu.up.hide{transform:scale(.92) translateY(6px)}
.menu button{width:100%;min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px;border-radius:var(--r-m);font-weight:700;font-size:16px;text-align:left;transition:background .15s}
.menu button:hover,.menu button:focus-visible{background:color-mix(in srgb,var(--ink) 9%,transparent);outline:none}
.menu button[aria-selected="true"]{color:var(--accent)}
.menu button svg.i{width:18px;height:18px;opacity:0}
.menu button[aria-selected="true"] svg.i{opacity:1}

/* detail view */
.dhead{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.dhead .ico{width:56px;height:56px;border-radius:var(--r-m)}
.dhead .ico svg.i{width:26px;height:26px}
.dhead h3{font-size:24px}
.kv{list-style:none;margin:0 0 16px;padding:2px 0;border-radius:var(--r-m);background:color-mix(in srgb,var(--surface) 70%,transparent);border:1px solid rgb(255 255 255 / .12)}
.kv li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;min-height:48px}
.kv li+li{border-top:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}
.kv b{font-weight:700;text-align:right;overflow-wrap:anywhere}
.notes{margin:0 0 16px;padding:14px 16px;border-radius:var(--r-m);background:color-mix(in srgb,var(--surface) 70%,transparent);border:1px solid rgb(255 255 255 / .12);white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere}
.notes.none{color:var(--muted)}

/* look editor */
.swatches{display:flex;gap:9px;flex-wrap:nowrap;align-items:center}
.sw{flex:none;width:34px;height:34px;border-radius:50%;background:var(--c);box-shadow:inset 0 1px 0 rgb(255 255 255 / .5),0 2px 6px rgb(0 0 0 / .18);position:relative;display:grid;place-items:center;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.sw:active{transform:scale(.9)}
.sw svg.i{width:18px;height:18px;color:#fff;opacity:0;stroke-width:3;filter:drop-shadow(0 1px 1px rgb(0 0 0 / .4))}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.sw[aria-pressed="true"] svg.i{opacity:1}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;padding:0}
.lookset{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.navrow{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-m);text-align:left;font-weight:800;margin-top:10px;
  background:color-mix(in srgb,var(--surface) 70%,transparent);border:1px solid rgb(255 255 255 / .12);box-shadow:inset 0 1px 0 var(--hi)}
.navrow span.t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.navrow span.t small{font-weight:500;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navrow .chev{color:var(--muted);transform:rotate(-90deg)}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:var(--accent);height:40px}
.back .chev{transform:rotate(90deg)}

/* 3D tilt (inside openers) */
.tilt{transform:perspective(600px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .45s cubic-bezier(.22,1,.36,1);position:relative;overflow:hidden}
.tilt.live{transition:transform .08s linear}
.tilt::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgb(255 255 255 / .5),rgb(255 255 255 / 0) 55%);mix-blend-mode:soft-light}
.tilt.live::after{opacity:1}

/* customised looks */
:root[data-head="sans"]{--serif:'Geist',ui-sans-serif,system-ui,sans-serif}
:root[data-head="rounded"]{--serif:ui-rounded,'SF Pro Rounded','Geist',sans-serif}
:root[data-head="sans"] :is(h1,h2,h3,.card h4),:root[data-head="rounded"] :is(h1,h2,h3,.card h4){font-weight:800;letter-spacing:-.015em}
:root[data-corners="tight"]{--r-xl:14px;--r-l:10px;--r-m:9px;--r-s:7px}
:root[data-corners="tight"] .ico{border-radius:var(--r-xs)}

/* macro bars in the hero */
.macros b small{font:400 11px var(--mono);opacity:.75;margin-left:2px}
.mbar{height:6px;border-radius:var(--r-xs);background:rgb(243 240 230 / .2);margin-top:6px;overflow:hidden}
.mbar i{display:block;height:100%;border-radius:var(--r-xs);background:var(--sage-ink)}

/* food logger */
.fl{display:flex;flex-direction:column;flex:1;min-height:0}
.fl-top{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.fl-top .chipx{height:40px;padding:0 14px;border-radius:999px;background:color-mix(in srgb,var(--ink) 10%,transparent);display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;white-space:nowrap}
.fl-top .ring2{border:2px solid color-mix(in srgb,var(--ink) 35%,transparent);background:none}
.fl-top .grow{flex:1}
.fl-tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-bottom:1px solid color-mix(in srgb,var(--ink) 14%,transparent);margin:0 -18px 12px;padding:0 10px}

.fl-tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:56px;padding:0 2px;font-weight:800;font-size:11.5px;color:var(--muted);position:relative;white-space:nowrap;min-width:0}
.fl-tabs button svg.i{width:19px;height:19px}
.fl-tabs button[aria-selected="true"]{color:var(--ink)}
.fl-tabs button[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:3px;border-radius:3px;background:var(--accent)}
.fl-body{flex:1;min-height:0;-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 16px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 16px),transparent);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;margin:0 -18px;padding:0 18px 8px;scrollbar-width:none}
.fl-body::-webkit-scrollbar{display:none}
.fl-bottom{display:flex;gap:10px;align-items:center;min-height:52px;padding:12px 18px 0;border-top:1px solid color-mix(in srgb,var(--ink) 10%,transparent);margin:0 -18px}
.searchbox{flex:1;display:flex;align-items:center;gap:8px;height:52px;padding:0 14px;border-radius:999px;border:2px solid color-mix(in srgb,var(--ink) 70%,transparent);background:color-mix(in srgb,var(--surface) 80%,transparent)}
.searchbox input{border:0;background:none;box-shadow:none;padding:0;height:48px}
.searchbox input:focus{box-shadow:none}
.logbtn{height:52px;padding:0 20px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:800;white-space:nowrap;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.logbtn:disabled{opacity:.45}
.logbtn:active{transform:scale(.95)}
.fres{list-style:none;margin:0;padding:0}
.fres li{border-bottom:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}
.frow{display:flex;align-items:center;gap:12px;padding:10px 0;min-height:60px}
.frow .fi{width:40px;height:40px;border-radius:var(--r-s);display:grid;place-items:center;font:800 13px var(--ui);color:#fff;flex:none;background:linear-gradient(160deg,var(--c1,#FF9F6B),var(--c2,#D9552E))}
.frow .ft{flex:1;min-width:0}
.frow .ft b{display:block;font-weight:700;font-size:15px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.frow .ft span{font:400 12px var(--mono);color:var(--muted)}
.addc{width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--ink) 12%,transparent);display:grid;place-items:center;flex:none;transition:transform .3s cubic-bezier(.34,1.56,.64,1),background .2s}
.addc.on{background:var(--accent);color:#fff;transform:rotate(45deg)}
.addc svg.i{width:18px;height:18px}
.serv{padding:4px 0 14px 52px;display:flex;flex-direction:column;gap:10px}
.serv .chipsrow{display:flex;gap:6px;flex-wrap:wrap}
.serv .chipsrow button{height:36px;padding:0 12px;border-radius:999px;background:color-mix(in srgb,var(--ink) 10%,transparent);font-weight:800;font-size:13px}
.serv .chipsrow button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.serv .line{display:flex;gap:8px;align-items:center}
.serv .line input{height:44px;padding:0 12px;width:110px}
.serv .macro{font:400 12px var(--mono);color:var(--ink2)}
.cart{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.cart span{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 12px;border-radius:999px;background:color-mix(in srgb,var(--accent) 18%,transparent);font-weight:700;font-size:13px;max-width:100%}
.cart span em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cart button{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 15%,transparent)}
.cart button svg.i{width:12px;height:12px}
.qa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.notice{padding:16px;border-radius:var(--r-m);background:color-mix(in srgb,var(--surface) 70%,transparent);border:1px solid rgb(255 255 255 / .12);color:var(--ink2);font-size:14px;line-height:1.5}
.notice b{color:var(--ink)}
.scanbox{position:relative;border-radius:var(--r-l);overflow:hidden;background:#000;aspect-ratio:4/3;max-height:34vh;width:100%}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox .frame{position:absolute;left:8%;right:8%;top:35%;height:30%;border:3px solid rgb(255 255 255 / .85);border-radius:var(--r-m);box-shadow:0 0 0 2000px rgb(0 0 0 / .35)}
.small{font-size:12px;color:var(--muted);margin-top:10px}

/* scan success */
.found{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;text-align:center;
  background:rgb(10 10 8 / .62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:fIn .3s ease both}
.fcheck{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#7EE2A0,#23A15A);box-shadow:0 10px 30px rgb(35 161 90 / .45);animation:fPop .55s cubic-bezier(.34,1.56,.64,1) both}
.fcheck svg{width:40px;height:40px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:fDraw .4s .3s ease forwards}
.found b{font:500 21px/1.2 var(--serif);padding:0 18px;max-width:100%;overflow-wrap:anywhere;animation:fUp .5s .2s cubic-bezier(.22,1,.36,1) both}
.found .kc{font:900 46px/1 var(--dot);animation:fUp .5s .3s cubic-bezier(.22,1,.36,1) both}
.found small{font:400 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;opacity:.8;animation:fUp .5s .35s both}
.found .bz{position:absolute;left:50%;top:calc(50% - 40px);width:9px;height:9px;margin:-4px;border-radius:50%;background:var(--c);transform:rotate(var(--a));animation:fBurst .9s .15s cubic-bezier(.22,1,.36,1) both}
@keyframes fIn{from{opacity:0}}@keyframes fPop{from{transform:scale(0)}}@keyframes fDraw{to{stroke-dashoffset:0}}
@keyframes fUp{from{opacity:0;transform:translateY(12px)}}
@keyframes fBurst{from{transform:rotate(var(--a)) translateY(0) scale(.4);opacity:1}to{transform:rotate(var(--a)) translateY(-120px) scale(1);opacity:0}}
@keyframes cartPop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:none}}
.cart span.new{animation:cartPop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.logbtn.bump{animation:bump .45s cubic-bezier(.34,1.56,.64,1)}
/* lock screen */
.lock{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;
  background:color-mix(in srgb,var(--bg) 70%,transparent);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6)}
.lock h3{text-align:center}
.dots{display:flex;gap:14px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);transition:background .15s,transform .2s}
.dots i.on{background:var(--ink);transform:scale(1.1)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.pad button{width:76px;height:76px;border-radius:50%;font:600 28px var(--ui);background:color-mix(in srgb,var(--surface) 60%,transparent);box-shadow:inset 0 1px 0 var(--hi),inset 0 0 0 1px rgb(255 255 255 / .1);transition:transform .2s,background .15s}
.pad button:active{transform:scale(.92);background:color-mix(in srgb,var(--ink) 18%,transparent)}
.pad .blank{visibility:hidden}
.lockmsg{min-height:20px;font-size:14px;color:var(--late);font-weight:700;text-align:center}

.flsum{flex:1;min-width:0;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pane{min-width:0}
.day-scroll{position:relative;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;margin:0 -2px;padding:0 2px;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 14px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(to bottom,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
.day-scroll::-webkit-scrollbar{display:none}
.day-scroll .wk-body{margin:8px 0}
button.av{cursor:pointer;transition:transform .2s}
button.av:active{transform:scale(.92)}
.set-grp+.qa,.set-grp+.hsugg,.set-grp+.fld{margin-top:12px}

.stages button[aria-pressed="true"]{background:var(--accent);color:#fff}.stages button.rej[aria-pressed="true"]{background:var(--late)}
details.sec>summary{list-style:none;cursor:pointer}details.sec>summary::-webkit-details-marker{display:none}
 /* startup */
#splashBg{position:fixed;inset:0 0 calc(-1 * var(--gap)) 0;z-index:79;background:var(--bg);transition:opacity .6s ease}
#splashCv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#splash .hi span{display:block}#splash .hi .sl2{margin-top:2px}
#bgGlow{position:absolute;inset:0;opacity:0;pointer-events:none;background:radial-gradient(60% 40% at 55% 45%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%);will-change:opacity}
#bgComet{position:absolute;left:0;top:0;width:180px;height:180px;border-radius:50%;opacity:0;pointer-events:none;will-change:transform,opacity;
  background:radial-gradient(circle,rgb(255 236 214 / .9) 0,color-mix(in srgb,var(--accent) 55%,transparent) 14%,color-mix(in srgb,var(--accent) 18%,transparent) 38%,transparent 68%)}
#splash{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;pointer-events:none}
#splash .mark{will-change:transform,opacity;width:96px;height:96px;overflow:visible;transition:opacity .35s ease,transform .6s cubic-bezier(.22,1,.36,1)}
#splash .r{fill:none;stroke-width:9;stroke-linecap:round;transform:rotate(-90deg);transform-origin:60px 60px}
#splash .r1{stroke:var(--accent);stroke-dasharray:276.5;stroke-dashoffset:276.5}
#splash .r2{stroke:var(--sage-soft);stroke-dasharray:201;stroke-dashoffset:201}
#splash .r3{stroke:var(--ink);stroke-dasharray:125.7;stroke-dashoffset:125.7;opacity:.85}
#splash .orb{fill:var(--accent);transform:scale(0);transform-origin:60px 16px}
#splash .hi{will-change:transform;font:500 clamp(28px,9vw,42px)/1.12 var(--serif);white-space:nowrap;text-align:center;max-width:calc(100vw - 32px);letter-spacing:-.01em;opacity:0;transform:translateY(10px);transform-origin:0 0;will-change:transform}
#splash .hi em{font-style:italic;color:var(--accent)}
#splash.go .r1{animation:draw1 .8s cubic-bezier(.65,0,.35,1) forwards}
#splash.go .r2{animation:draw2 .8s .08s cubic-bezier(.65,0,.35,1) forwards}
#splash.go .r3{animation:draw3 .8s .16s cubic-bezier(.65,0,.35,1) forwards}
#splash.go .orb{animation:pop .45s .6s cubic-bezier(.34,1.56,.64,1) forwards}
#splash.go .hi{animation:rise .6s .3s cubic-bezier(.22,1,.36,1) forwards}
#splash.fly .mark{transition:none}
@keyframes draw1{to{stroke-dashoffset:62}}@keyframes draw2{to{stroke-dashoffset:70}}@keyframes draw3{to{stroke-dashoffset:52}}
@keyframes pop{to{transform:scale(1)}}@keyframes rise{to{opacity:1;transform:none}}
@media (max-width:370px){.hero .big{font-size:50px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tabs button{font-size:9px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
:root[data-motion="off"] *,:root[data-motion="off"] *::before,:root[data-motion="off"] *::after{transition-duration:.01ms!important;animation-duration:.01ms!important}

const dayDiff=s=>Math.round((new Date(s+'T00:00')-new Date(today()+'T00:00'))/864e5);

const ampm=t=>t&&!C24()?(Number(t.split(':')[0])<12?'AM':'PM'):'';

function load(){

/* fast lookups: one pass builds an index by type and id; it rebuilds only when the data changes (DATA_VER) */

/* ---------- row content ---------- */
function titleOf(e){
  if(e.type==='weight')return`${e.value} lb`;

}
function subOf(e){
  const j=a=>a.filter(Boolean).join(' · ');
  switch(e.type){
    case'class':return j([(e.days||[]).join(' '),e.place]);
    case'task':return j([e.project,e.priority==='High'?'High priority':'']);
    case'meeting':return j([fmtDate(e.date),fmtT(e.time),e.with]);
    case'project':return e.next?`Next: ${e.next}`:'';
    case'food':return j([e.meal,e.grams?`${e.grams} g`:'',(e.protein!==''&&e.protein!=null)?`${Math.round(num(e.protein))}P ${Math.round(num(e.fat))}F ${Math.round(num(e.carbs))}C`:'',e.date&&dayDiff(e.date)?fmtDate(e.date):'']);
    case'weight':return fmtLong(e.date);
    case'workout':return j([fmtDate(e.date),e.notes?e.notes.split('\n')[0]:'']);
    case'injury':return j([e.status,e.date?`since ${fmtDate(e.date)}`:'',e.notes?e.notes.split('\n')[0]:'']);
    case'idea':return e.tag||'';
    case'note':return(e.notes||'').split('\n')[0];
    case'reminder':return j([relDue(e.due),fmtT(e.time)]);
    case'scrap':return fmtDate(iso(new Date(e.created)));
  }
  return'';
}
function metaOf(e){
  switch(e.type){

    case'task':case'reminder':{if(!e.due||e.done)return['',''];const n=dayDiff(e.due);return[relDue(e.due),n<0?'late':n===0?'soon':'']}
    case'food':return[e.kcal?`${e.kcal} kcal`:'',''];

    case'project':return[e.status||'',''];

    case'copyExp':{const t=$('#exp');const fb=()=>{t.select();toast('Select all and copy')};if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>toast('Backup copied'),fb);else fb();break}
    case'doImp':arm(el,'Tap again to replace everything',()=>{
      try{const d=JSON.parse($('#imp').value);if(!Array.isArray(d.entries))throw 0;
        d.entries=d.entries.filter(e=>e&&TYPES[e.type]&&e.id);db={entries:d.entries,settings:{...DEF,...db.settings,...(d.settings||{})}};save();applyLook();closeSheet();render(false);toast(`Restored ${db.entries.length} entries`)}
      catch(e){toast('That is not a valid backup')}});break;

<script>
/* ===================== food database + logger ===================== */
let FOODS=null,foodsLoading=null;
function loadFoods(){
  if(FOODS)return Promise.resolve(FOODS);
  if(foodsLoading)return foodsLoading;
  foodsLoading=fetch('foods.txt').then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>{
    FOODS=t.split('\n').map(l=>{const[n,k,p,c,f,s,a]=l.split('\t');return{n,k:+k,p:+p,c:+c,f:+f,s,lc:(n+' '+(a||'')).toLowerCase()}});
    return FOODS}).catch(()=>{foodsLoading=null;return[]});
  return foodsLoading;
}
function searchFoods(q){
  const words=q.toLowerCase().split(/[\s,]+/).filter(Boolean);if(!words.length||!FOODS)return[];
  const out=[];
  for(const x of FOODS){
    if(!words.every(w=>x.lc.includes(w)))continue;
    const nl=x.n.toLowerCase();
    let sc=nl.startsWith(words[0])?0:x.lc.split(/[\s,()]+/).includes(words[0])?4:9;
    sc+=x.n.length/25+(x.n.split(',').length-1)*.8+(x.s==='IN'?-1.5:x.s==='ONB'?3:x.s==='ONR'?1.5:0)+(/\b(raw|cooked|boiled)\b/.test(nl)?-.5:0)+(/[A-Z]{4,}/.test(x.n)?2:0);
    out.push([sc,x]);
  }
  return out.sort((a,b)=>a[0]-b[0]).slice(0,40).map(o=>o[1]);
}
const FL={tab:'search',q:'',cart:[],open:null,meal:null,results:[],online:null,lastScan:null};
const lib=()=>(db.lib=db.lib||[]);
const mealNow=()=>{const h=new Date().getHours();return h<11?'Breakfast':h<15?'Lunch':h<21?'Dinner':'Snack'};
const per=(it,g)=>it.per100?{k:it.per100.k*g/100,p:it.per100.p*g/100,f:it.per100.f*g/100,c:it.per100.c*g/100}:{k:it.k,p:it.p,f:it.f,c:it.c};
const cartTotal=()=>FL.cart.reduce((t,i)=>({k:t.k+i.k,p:t.p+i.p,f:t.f+i.f,c:t.c+i.c}),{k:0,p:0,f:0,c:0});
function recentFoods(){
  const seen=new Set(),out=[];
  for(const e of [...of('food')].sort((a,b)=>b.created-a.created)){const k=(e.title||'').toLowerCase();if(!k||seen.has(k))continue;seen.add(k);
    out.push(e.per100?{name:e.title,per100:e.per100,grams:num(e.grams)||100,src:'Recent'}:{name:e.title,k:num(e.kcal),p:num(e.protein),f:num(e.fat),c:num(e.carbs),src:'Recent'});if(out.length>=12)break}
  return out;
}
const SRCL={IN:'India (IFCT)',US:'USDA',TL:'TempoLife',FNDDS:'USDA FNDDS',FDN:'USDA Foundation',ON:'OpenNutrition',ONR:'OpenNutrition · Restaurant',ONB:'OpenNutrition · Brand'};
const fromDb=x=>({name:x.n,per100:{k:x.k,p:x.p,f:x.f,c:x.c},grams:100,src:SRCL[x.s]||x.s||'Database'});
function initials(n){return(n.replace(/[^A-Za-z ]/g,'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('')||'·').toUpperCase()}
const KCOL=[['#FF9F6B','#D9552E'],['#93C97A','#4A8A3E'],['#F5CB6B','#C98A14'],['#7CB7DE','#3A72A8'],['#C9A7E8','#7D55B5'],['#62C7BE','#1F7C80']];
function foodRow(it,key){
  const col=KCOL[[...it.name].reduce((a,c)=>a+c.charCodeAt(0),0)%KCOL.length];
  const m=it.per100?`${Math.round(it.per100.k)} kcal · ${it.per100.p}P ${it.per100.f}F ${it.per100.c}C / 100 g`:`${Math.round(it.k)} kcal · ${Math.round(it.p)}P ${Math.round(it.f)}F ${Math.round(it.c)}C${it.serving?` / ${esc(it.serving)}`:''}`;
  const open=FL.open===key;
  return`<li data-fkey="${key}"><div class="frow"><span class="fi" style="--c1:${col[0]};--c2:${col[1]}">${esc(initials(it.name))}</span><div class="ft"><b>${esc(it.name)}</b><span>${m}${it.src?` · ${esc(it.src)}`:''}</span></div><button class="fav${isFav(it)?' on':''}" data-fav="${key}" aria-pressed="${isFav(it)}" aria-label="Favourite ${esc(it.name)}">${ic('star')}</button><button class="addc${open?' on':''}" data-fopen="${key}" aria-label="Add ${esc(it.name)}" aria-expanded="${open}">${ic('plus')}</button></div>${open?servPanel(it,key):''}</li>`;
}
function servPanel(it,key){
  const cr=/OpenNutrition/.test(it.src||'')?`<p class="small" style="margin:0">Data: <a href="https://www.opennutrition.app" target="_blank" rel="noopener">OpenNutrition</a>${/Brand/.test(it.src)?' · © Open Food Facts contributors':''} (ODbL)</p>`:'';
  if(!it.per100)return`<div class="serv"><div class="macro">1 serving · ${Math.round(it.k)} kcal</div><div class="line"><label class="cap" for="sq-${key}">Servings</label><input id="sq-${key}" type="number" inputmode="decimal" step="any" value="1" data-sq></div><button class="primary" style="height:46px" data-fadd="${key}">Add to log</button></div>`;
  const g=it.grams||100,v=per(it,g);
  return`<div class="serv"><div class="line"><label class="cap" for="uq-${key}">Amount</label><input id="uq-${key}" type="number" inputmode="decimal" step="any" value="1" data-uq style="width:76px"><div class="units">${UNITS.map(([u])=>`<button data-unit="${u}" aria-pressed="false">${u}</button>`).join('')}</div></div><div class="unote small"></div><div class="chipsrow">${[50,100,150,200,250].map(n=>`<button data-grams="${n}" aria-pressed="${n===g}">${n} g</button>`).join('')}${it.servingG?`<button data-grams="${it.servingG}">1 serving</button>`:''}</div>
    <div class="line"><label class="cap" for="sg-${key}">Grams</label><input id="sg-${key}" type="number" inputmode="decimal" step="any" value="${g}" data-sg></div>
    <div class="macro" data-live>${Math.round(v.k)} kcal · ${v.p.toFixed(1)}P ${v.f.toFixed(1)}F ${v.c.toFixed(1)}C</div>
    <button class="primary" style="height:46px" data-fadd="${key}">Add to log</button>${cr}</div>`;
}
let FITEMS={};
function listFoods(items,prefix){return`<ul class="fres">${items.map((it,i)=>{const k=prefix+i;FITEMS[k]=it;return foodRow(it,k)}).join('')}</ul>`}
function flBody(){
  FITEMS={};
  if(FL.tab==='search'){
    if(!FL.q.trim()){const r=recentFoods(),fv=lib().filter(x=>x.fav||x.recipe),l=lib().filter(x=>!x.fav&&!x.recipe);
      return(fv.length?`<div class="cap" style="margin:4px 0 6px">${ic('star')} Favourites</div>${listFoods(fv,'v')}`:'')
        +(r.length?`<div class="cap" style="margin:${fv.length?16:4}px 0 6px">Latest</div>${listFoods(r,'r')}`:'')
        +(l.length?`<div class="cap" style="margin:16px 0 6px">My foods</div>${listFoods(l,'l')}`:'')
        +(!r.length&&!l.length?`<p class="hint">Search ${FOODS?FOODS.length.toLocaleString():'7,000'}+ foods, including Indian dishes like paneer, dal and roti.</p>`:'');}
    if(!FOODS)return`<p class="hint">Loading the food database…</p>`;
    const mine=lib().filter(x=>x.name.toLowerCase().includes(FL.q.toLowerCase()));
    const res=searchFoods(FL.q).map(fromDb);
    let h=(mine.length?`<div class="cap" style="margin:4px 0 6px">My foods</div>${listFoods(mine,'m')}`:'')
      +(res.length?`<div class="cap" style="margin:12px 0 6px">Built-in database</div>${listFoods(res,'s')}`:`<p class="hint">No match in the built-in database.</p>`);
    if(FL.online&&FL.online.q===FL.q){h+=FL.online.err?`<div class="notice" style="margin-top:12px">${FL.online.err}</div>`:FL.online.items?`<div class="cap" style="margin:16px 0 6px">${syncOn()?'More foods · USDA + Open Food Facts':'Packaged foods · Open Food Facts'}</div>${FL.online.items.length?listFoods(FL.online.items,'o'):'<p class="hint">No packaged foods found.</p>'}`:`<p class="hint">${syncOn()?'Searching USDA and Open Food Facts…':'Searching packaged foods…'}</p>`}
    else if(!syncOn())h+=`<button class="secondary" style="width:100%;margin-top:14px" data-online>Search packaged foods online</button>`;
    return h+`<p class="small">Food data: USDA FoodData Central (public domain) · IFCT 2017 (India) · TempoLife (CC-BY-4.0) · <a href="https://www.opennutrition.app" target="_blank" rel="noopener">OpenNutrition</a> (ODbL) · © Open Food Facts contributors (ODbL).</p>`;
  }
  if(FL.tab==='scan')return`<div class="scanbox" id="scanbox"><video id="scanvid" playsinline muted></video><div class="frame"></div></div>
    <div class="sh-actions"><button class="primary" id="scanStart">${ic('search')}Start camera</button></div>
    <label class="fld" for="bcode" style="margin-top:14px"><span>Or type the barcode</span><input id="bcode" inputmode="numeric" placeholder="e.g. 5000159484695"></label>
    <div class="sh-actions" style="margin-top:0"><button class="secondary" id="bcGo">Look up barcode</button></div>
    <div id="scanOut">${FL.lastScan?FL.lastScan:''}</div>
    <p class="small">Barcodes are looked up in Open Food Facts, a free database of about 3 million packaged foods.</p>`;
  if(FL.tab==='quick')return`<label class="fld" for="qaN"><span>Name (optional)</span><input id="qaN" placeholder="Quick add"></label>
    <label class="fld" for="qaK"><span>Energy (kcal)</span><input id="qaK" type="number" inputmode="decimal" step="any"></label>
    <div class="qa"><label class="fld" for="qaP"><span>Protein g</span><input id="qaP" type="number" inputmode="decimal" step="any"></label><label class="fld" for="qaF"><span>Fat g</span><input id="qaF" type="number" inputmode="decimal" step="any"></label><label class="fld" for="qaC"><span>Carbs g</span><input id="qaC" type="number" inputmode="decimal" step="any"></label></div>
    <p class="small" id="qaSum">Macro sum: 0 kcal</p>
    <div class="sh-actions"><button class="secondary" id="qaSave">Add + save to My foods</button><button class="primary" id="qaAdd">Add</button></div>`;
  if(FL.tab==='library'){const l=lib(),c=FL.cart.length;
    return(c?`<div class="notice" style="margin-bottom:14px">Save the <b>${c} item${c>1?'s':''}</b> you've picked as a recipe you can log in one tap.<label class="fld" for="rcN" style="margin-top:12px"><span>Recipe name</span><input id="rcN" placeholder="e.g. Chicken rice bowl"></label><label class="fld" for="rcS"><span>Makes how many servings</span><input id="rcS" type="number" inputmode="numeric" value="1"></label><button class="primary" style="width:100%" id="rcSave">Save recipe</button></div>`:'')
      +(l.filter(x=>x.recipe).length?`<div class="cap" style="margin:4px 0 6px">Favourite meals</div>${listFoods(l.filter(x=>x.recipe),'lm')}`:'')
      +(l.filter(x=>!x.recipe).length?`<div class="cap" style="margin:14px 0 6px">Favourite &amp; saved foods</div>${listFoods(l.filter(x=>!x.recipe),'lf')}`:'')
      +(l.length?'':`<p class="hint">Star any food to make it a favourite. Pick several foods, then come here to save them as a favourite meal you can log in one tap.</p>`);}
  return`<div class="notice"><b>Coming later: AI logging</b><br>Photo or “2 rotis, dal and rice” logging needs an AI model behind your server, which isn’t set up yet. Use Search, Scan, Quick add or Copy yesterday for now.</div>`;

function flHeader(){
  const t=cartTotal(),g=db.settings,eaten=sumKcal(of('food').filter(e=>e.date===today()));
  return`<div class="fl-top">
    <div style="width:132px">${selectHTML('flmeal',['Breakfast','Lunch','Dinner','Snack'],FL.meal,'flMeal')}</div>
    <span class="chipx ring2 num" title="Picked / left today">${fmtN(t.k)} / ${fmtN(Math.max(0,g.kcal-eaten))}</span><span class="grow"></span><button class="chipx" id="flCopy" aria-label="Copy yesterday’s food">${ic('copy')}Yesterday</button></div>
    <div class="fl-tabs" role="tablist">${[['search','Search','search'],['scan','Scan','task'],['quick','Quick add','plus'],['library','Library','folder'],['ai','AI','idea']].map(([k,l,i])=>`<button role="tab" aria-selected="${FL.tab===k}" data-ftab="${k}">${ic(i)}${l}</button>`).join('')}</div>
    <div class="cart">${FL.cart.map((c,i)=>`<span><em>${esc(c.name)} · ${Math.round(c.k)}</em><button data-cartdel="${i}" aria-label="Remove ${esc(c.name)}">${ic('close')}</button></span>`).join('')}</div>`;
}
function flBottom(){
  const n=FL.cart.length;
  const tk=cartTotal().k;
  return`<div class="fl-bottom">${FL.tab==='search'?`<label class="searchbox" for="fq">${ic('search')}<input id="fq" type="search" autocomplete="off" placeholder="Search for a food" value="${esc(FL.q)}"></label>`:`<span class="flsum">${n?`${n} picked · ${fmtN(tk)} kcal`:'Pick foods, then tap Log'}</span>`}<button class="logbtn" id="flLog" ${n?'':'disabled'}>Log${n?` ${n}`:''}</button></div>`;
}
function openFoodLog(){

  openSheet(`${sheetHead('Log <em>food</em>')}<div class="fl"><div id="flHead">${flHeader()}</div><div class="fl-body" id="flBody">${flBody()}</div><div id="flBot">${flBottom()}</div></div>`);

function flRefresh(all=true){

}
function addToCart(it,qty){
  const v=it.per100?per(it,qty):{k:it.k*qty,p:it.p*qty,f:it.f*qty,c:it.c*qty};
  FL.cart.push({name:it.name,grams:it.per100?qty:'',per100:it.per100||null,servings:it.per100?null:qty,...v});
  FL.open=null;flRefresh();tick();
  const last=$$('.cart span').pop();if(last)last.classList.add('new');const lb=$('#flLog');if(lb){lb.classList.remove('bump');void lb.offsetWidth;lb.classList.add('bump')}
}
async function offFetch(url){
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),9000);
  try{const r=await fetch(url,{signal:ctl.signal,headers:{Accept:'application/json'}});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(t)}
}
const OFF_FAIL='Couldn’t reach the online food database from this preview. It works once the app is installed from GitHub. The built-in database above works everywhere.';
function offItem(p){
  const n=p.nutriments||{},k=n['energy-kcal_100g']??(n.energy_100g?n.energy_100g/4.184:null);
  if(k==null||!p.product_name)return null;
  const sq=parseFloat(p.serving_quantity);
  return{name:(p.brands?p.brands.split(',')[0].trim()+' ':'')+p.product_name,per100:{k:+(+k).toFixed(0),p:+(+n.proteins_100g||0).toFixed(1),f:+(+n.fat_100g||0).toFixed(1),c:+(+n.carbohydrates_100g||0).toFixed(1)},grams:sq>0?sq:100,servingG:sq>0?sq:null,src:'Open Food Facts',code:p.code};
}
async function onlineSearch(){

    FL.online={q,items:(d.products||[]).map(offItem).filter(Boolean)}}
  catch(e){FL.online={q,err:OFF_FAIL}}

function scanFound(it){
  const box=$('#scanbox');if(!box)return;box.querySelector('.found')?.remove();
  const cols=['#FF9F6B','#7EE2A0','#F5CB6B','#9DB4FF','#F28A92','#fff'];
  const o=document.createElement('div');o.className='found';o.setAttribute('role','status');
  o.innerHTML=`${[...Array(14)].map((_,i)=>`<i class="bz" style="--a:${i*360/14}deg;--c:${cols[i%cols.length]}"></i>`).join('')}<div class="fcheck">${ic('check')}</div><b>${esc(it.name)}</b><span class="kc num">0</span><small>kcal per 100 g · tap + below to add</small>`;
  box.appendChild(o);if(navigator.vibrate)navigator.vibrate([20,40,20]);
  const end=Math.round(it.per100.k),kc=o.querySelector('.kc'),t0=performance.now();
  (function step(t){const p=Math.min(1,(t-t0)/700),e=1-Math.pow(1-p,3);kc.textContent=Math.round(end*e);if(p<1)requestAnimationFrame(step)})(t0);
  o.addEventListener('click',()=>{o.style.transition='opacity .3s';o.style.opacity='0';setTimeout(()=>o.remove(),300)});
  setTimeout(()=>{if(o.isConnected){o.style.transition='opacity .4s';o.style.opacity='0';setTimeout(()=>o.remove(),400)}},2600);
}
async function lookupBarcode(code){

/* ===================== end-to-end encryption for everything this app sends to your server =====================
   Your sync passphrase never leaves the device. From it (plus your server's address as salt) each device
   derives the same AES-256-GCM key with PBKDF2-SHA256 (600,000 rounds). Synced data, notebooks and server
   backups are compressed, then encrypted here; the server only ever stores {e2e,iv,ct}. */
const E2E={key:null,on:false};
const e2eB64=b=>{let s='';const u=new Uint8Array(b);for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const e2eUnb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function e2eDerive(pass,server){
  const enc=new TextEncoder(),salt=await crypto.subtle.digest('SHA-256',enc.encode('life-e2e-v1:'+String(server||'').replace(/\/+$/,'').toLowerCase()));
  const base=await crypto.subtle.importKey('raw',enc.encode(pass.normalize('NFKC')),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:600000},base,256));
}
async function e2eUse(raw){E2E.key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);E2E.on=true}
async function e2eLoad(){try{const s=localStorage.getItem('ishiros.e2e');if(s)await e2eUse(e2eUnb64(s))}catch(e){}}
async function e2eZip(bytes,dir){
  if(typeof CompressionStream==='undefined')return null;
  const s=new Blob([bytes]).stream().pipeThrough(dir?new CompressionStream('gzip'):new DecompressionStream('gzip'));
  return new Uint8Array(await new Response(s).arrayBuffer())}
async function e2eSeal(obj){
  let data=new TextEncoder().encode(JSON.stringify(obj)),z=0;
  try{const c=await e2eZip(data,true);if(c){data=c;z=1}}catch(e){}
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},E2E.key,data);
  return{e2e:1,v:1,z,iv:e2eB64(iv),ct:e2eB64(ct)}}
async function e2eOpen(box){
  if(!E2E.key)throw new Error('Enter your sync passphrase first');
  let data;try{data=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:e2eUnb64(box.iv)},E2E.key,e2eUnb64(box.ct)))}
  catch(e){throw new Error('Wrong sync passphrase for this data')}
  if(box.z)data=await e2eZip(data,false);
  return JSON.parse(new TextDecoder().decode(data))}
e2eLoad();

const SNAP={p:null,
  open(){return this.p||(this.p=new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('no idb'));const r=indexedDB.open('life-snaps',1);r.onupgradeneeded=()=>r.result.createObjectStore('s',{keyPath:'day'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},

async function api(path,opt={}){
  const h={'X-Life-Key':SYNC.key,...(opt.headers||{})};if(opt.body&&!opt.raw)h['Content-Type']='application/json';if(opt.raw)h['Content-Type']='text/plain';
  const r=await fetch(SYNC.url.replace(/\/+$/,'')+path,{method:opt.method||'GET',body:opt.body,headers:h});
  if(!r.ok){let m=r.status+'';try{const j=await r.json();m=j.error||j.message||m}catch(e){}throw new Error(m)}

}

function buildSchedule(){
  const n=NS(),out=[],now=Date.now(),lim=now+7*864e5;
  const add=(id,dt,title,body,url)=>{if(!dt)return;const t=dt.getTime();if(t>now-6e4&&t<lim)out.push({id,at:dt.toISOString(),title,body:body||'',url:url||APP_URL,tag:id})};
  for(let i=0;i<7;i++){const d=addDays(i),wd=wdOf(d);
    if(n.reminders)of('reminder').filter(e=>!e.done&&e.due===d).forEach(e=>add('r:'+e.id,atLocal(d,e.time||'09:00'),e.title,'Reminder'));

  }

}

/* ---------- weight: trend line (exponential moving average) + real weekly rate ---------- */
function dailyWeights(ws){const m=new Map();for(const e of ws){const a=m.get(e.date)||[];a.push(num(e.value));m.set(e.date,a)}return[...m].sort((a,b)=>a[0].localeCompare(b[0])).map(([date,a])=>({date,value:a.reduce((s,v)=>s+v,0)/a.length}))}
/* trend_t = trend_(t-1) + α·(scale_t − trend_(t-1)),  α = 1 − 0.9^(days since last weigh-in)  → each day moves 10% toward the scale */
function trendSeries(ws){let t=null,prev=null;return dailyWeights(ws).map(e=>{const v=e.value,d=new Date(e.date+'T00:00').getTime();if(t===null)t=v;else{const dd=Math.max(1,Math.round((d-prev)/864e5));t=t+(1-Math.pow(.9,dd))*(v-t)}prev=d;return{date:e.date,v,t}})}
/* weekly rate = least-squares slope of the trend over the last 21 days × 7 */
function trendRate(tr){const cut=new Date(addDays(-21)+'T00:00').getTime(),p=tr.map(x=>({x:new Date(x.date+'T00:00').getTime()/864e5,y:x.t})).filter(q=>q.x*864e5>=cut);
  if(p.length<3||p[p.length-1].x-p[0].x<5)return null;const n=p.length,mx=p.reduce((s,q)=>s+q.x,0)/n,my=p.reduce((s,q)=>s+q.y,0)/n;
  const sxx=p.reduce((s,q)=>s+(q.x-mx)**2,0);return sxx?p.reduce((s,q)=>s+(q.x-mx)*(q.y-my),0)/sxx*7:null}
function weightDelta(ws){const r=trendRate(trendSeries(ws));if(r!==null)return r;const last=ws[ws.length-1],ref=[...ws].reverse().find(e=>e.date<=addDays(-7));return last&&ref?num(last.value)-num(ref.value):null}
function chart(ws,W=320,H=140){
  const tr=trendSeries(ws).slice(-45);
  if(tr.length<2)return`<p class="hint" style="margin-top:12px">Log two weigh-ins to see your trend.</p>`;
  const L=6,R=6,T=14,B=20,ts=tr.map(e=>new Date(e.date+'T00:00').getTime());
  const goal=db.settings.goalWeight===''?null:num(db.settings.goalWeight);
  const all=[...tr.map(e=>e.v),...tr.map(e=>e.t),...(goal&&Math.abs(goal-tr[tr.length-1].t)<15?[goal]:[])];
  let mn=Math.min(...all),mx=Math.max(...all);if(mx-mn<1){mn-=.5;mx+=.5}
  const t0=ts[0],t1=ts[ts.length-1],x=t=>L+(t1===t0?0:(t-t0)/(t1-t0))*(W-L-R),y=v=>T+(mx-v)/(mx-mn)*(H-T-B);
  const pts=tr.map((e,i)=>`${x(ts[i]).toFixed(1)},${y(e.t).toFixed(1)}`),ex=x(t1),ey=y(tr[tr.length-1].t);
  const grid=[0,.5,1].map(f=>{const yy=(T+f*(H-T-B)).toFixed(1);return`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-dasharray="2 5"/>`}).join('');
  const gl=goal&&goal>=mn&&goal<=mx?`<line x1="${L}" x2="${W-R}" y1="${y(goal).toFixed(1)}" y2="${y(goal).toFixed(1)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-R}" y="${(y(goal)-5).toFixed(1)}" text-anchor="end" font-size="10" font-family="Space Mono, monospace" fill="var(--good)">GOAL ${goal}</text>`:'';
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend weight from ${tr[0].t.toFixed(1)} to ${tr[tr.length-1].t.toFixed(1)} lb, scale weights shown as dots">
    <defs><linearGradient id="wg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".24"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${grid}${gl}
    <path d="M${x(t0)},${H-B} L${pts.join(' L')} L${ex},${H-B} Z" fill="url(#wg)"/>
    ${tr.map((e,i)=>`<circle cx="${x(ts[i]).toFixed(1)}" cy="${y(e.v).toFixed(1)}" r="2.6" fill="var(--muted)" opacity=".75"/>`).join('')}
    <polyline class="line" points="${pts.join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${ex}" cy="${ey}" r="6" fill="var(--surface)" stroke="var(--accent)" stroke-width="3"/>
    <text x="${L}" y="${H-4}" font-size="10" font-family="Space Mono, monospace" fill="var(--muted)">${esc(fmtDate(tr[0].date).toUpperCase())}</text>
    <text x="${W-R}" y="${H-4}" text-anchor="end" font-size="10" font-family="Space Mono, monospace" fill="var(--muted)">${esc(fmtDate(tr[tr.length-1].date).toUpperCase())}</text></svg>`;
}
function weightCard(){
  const ws=weights(),tr=trendSeries(ws),last=tr[tr.length-1],rate=trendRate(tr);
  const g=db.settings.goalWeight,eta=last&&g!==''&&rate&&Math.sign(num(g)-last.t)===Math.sign(rate)&&Math.abs(rate)>.05?Math.ceil(Math.abs(num(g)-last.t)/Math.abs(rate)):null;
  return`<section class="wcard card-s">
    <div class="wtop"><div><div class="cap">Trend weight</div><div class="wnum num">${last?last.t.toFixed(1):'—'}<small>LB</small></div>
      <div class="goal">${last?`Scale ${last.v.toFixed(1)} lb on ${esc(fmtDate(last.date))}`:'No weigh-ins yet'}${g!==''&&last?` · goal ${esc(g)}${eta?`, about ${eta} wk at this rate`:''}`:''}</div></div>${rate===null?'':deltaPill(rate)}</div>
    ${chart(ws)}
    <p class="small" style="margin:6px 0 0">Line = trend (each day moves 10% toward the scale, so water swings don’t mislead you). Dots = scale readings. Rate = trend slope over 21 days.</p>
  </section>`;
}

/* ---------- workouts: templates, sets × reps × weight, progress per exercise ---------- */
const tpls=()=>(db.templates=db.templates||[]);
const e1rm=(w,r)=>num(w)*(1+num(r)/30); /* Epley estimate of a one-rep max */
function exHistory(){
  const m={};
  for(const e of of('workout').filter(x=>x.ex&&x.date).sort((a,b)=>a.date.localeCompare(b.date)))for(const x of e.ex){
    const sets=(x.sets||[]).filter(s=>num(s.r)>0);if(!sets.length)continue;
    const best=sets.reduce((b,s)=>e1rm(s.w,s.r)>e1rm(b.w,b.r)?s:b,sets[0]),vol=sets.reduce((t,s)=>t+num(s.r)*num(s.w),0);
    const k=x.name.trim().toLowerCase();(m[k]=m[k]||{name:x.name.trim(),pts:[]}).pts.push({date:e.date,id:e.id,best,est:e1rm(best.w,best.r),vol,sets})}
  return m;
}
const lastSets=name=>{const h=exHistory()[name.trim().toLowerCase()];return h?h.pts[h.pts.length-1].sets:null};
